name: Build and Push Docker Image

# 触发条件：push 到 main 分支时自动跑；也可在 Actions 页面手动点运行
# paths-ignore：只改部署配置 / 文档时不触发构建（镜像 = 源码，这些文件变了镜像也不用重建）。
# 注意：workflow_dispatch 不受 paths-ignore 影响，任何时候都能在 Actions 页面手动触发。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'deploy/**'
      - '**.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub 提供的 amd64 云端机器
    steps:
      # ① 拉取本仓库代码到这台云端机器
      - name: Checkout
        uses: actions/checkout@v4

      # ② 准备 Buildx（Docker 官方构建器）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ③ 登录 Docker Hub（账号/密码从 GitHub Secrets 读取，不写死在文件里）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ④ 构建镜像并推送到你的 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # 服务器是 amd64，云端直接出 amd64 镜像
          push: true
          # 构建镜像时跳过单元测试（.* 匹配所有测试名 = 全部跳过）
          # 原因：构建“可部署镜像”不需要跑测试；作者部分测试对时间/第三方数据敏感，CI 环境易挂
          build-args: |
            SKIP_TESTS=.*
          tags: |
            gaofei211/bookkeeping:latest
            gaofei211/bookkeeping:${{ github.sha }}
