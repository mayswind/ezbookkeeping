name: Ext CI

# Guards the extension module: tests, and that upstream files stay untouched except for the registered seams.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Seam check
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          scripts/check-seams.sh "$BASE"

      - name: Ext tests
        run: go test ./pkg/ext/...
